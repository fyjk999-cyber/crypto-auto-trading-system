# Cloud PAPER deployment — 24x7 exploration/learning environment.
# Safety contract: PAPER only, real public market data, NO real money, NO
# private OKX order submission. PostgreSQL and backend are internal-only;
# only crypto-proxy (80/443) is public.
#
# Required environment file (server-only, never committed): ../.env.cloud
#   POSTGRES_PASSWORD=...      DOMAIN=trading.example.com      ACME_EMAIL=...
name: crypto-paper

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  crypto-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto_trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.cloud}
      POSTGRES_DB: crypto_trader
      TZ: UTC
    volumes:
      - crypto_postgres_data:/var/lib/postgresql/data
      - ../server-data/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_trader -d crypto_trader"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [crypto-internal]
    logging: *default-logging

  crypto-backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: crypto-backend:paper
    restart: unless-stopped
    env_file:
      - ../.env.cloud
    environment:
      # Single source of truth for the cloud DB (overrides .env.cloud value).
      DATABASE_URL: postgresql+asyncpg://crypto_trader:${POSTGRES_PASSWORD}@crypto-postgres:5432/crypto_trader
    volumes:
      # Encrypted LLM SecretStore + master key (chmod 600, host-managed).
      - ../server-data/llm:/app/secrets
      - ../server-data/backups:/app/data/backups
      - ../server-data/logs:/app/data/logs
    depends_on:
      crypto-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [crypto-internal]
    logging: *default-logging

  crypto-frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_WS_URL: wss://${DOMAIN:-localhost}/ws
    image: crypto-frontend:paper
    restart: unless-stopped
    depends_on:
      crypto-backend:
        condition: service_healthy
    networks: [crypto-internal]
    logging: *default-logging

  crypto-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - crypto-backend
      - crypto-frontend
    networks: [crypto-internal]
    logging: *default-logging

  # One-shot daily pg_dump (7 daily / 4 weekly retention via backup script).
  crypto-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ../server-data/backups:/backups
    depends_on:
      crypto-postgres:
        condition: service_healthy
    networks: [crypto-internal]
    logging: *default-logging

volumes:
  crypto_postgres_data:
  caddy_data:
  caddy_config:

networks:
  crypto-internal:
    driver: bridge
