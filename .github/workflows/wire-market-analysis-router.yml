name: wire-market-analysis-router

on:
  push:
    paths:
      - .github/workflows/wire-market-analysis-router.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.event.head_commit.message == 'chore: wire market analysis router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire router with minimal patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/crypto_trader/api/app.py')
          text = path.read_text()
          import_line = 'from crypto_trader.api.deps import AppState\n'
          router_import = (
              'from crypto_trader.api.market_analysis import '
              'create_market_analysis_router\n'
          )
          if router_import not in text:
              text = text.replace(import_line, import_line + router_import, 1)

          marker = '    app.state.feedback_interface = ResearchFeedbackInterface()\n'
          include_line = '    app.include_router(create_market_analysis_router(state))\n'
          if include_line not in text:
              text = text.replace(marker, marker + include_line, 1)

          path.write_text(text)
          PY
      - name: Commit router wiring
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/crypto_trader/api/app.py
          git commit -m "feat: wire OKX market analysis API"
          git push origin main
