services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crypto_trader
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto_dev_password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: .
    env_file: [".env"]
    environment:
      DATABASE_URL: postgresql+asyncpg://crypto:crypto_dev_password@db:5432/crypto_trader
      LIVE_TRADING_ENABLED: "false"
    ports: ["8000:8000"]
    depends_on: ["db"]
volumes:
  pgdata:
